name = "worktoday"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[vars]
MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# All callers together (per Cloudflare location): bounds what a script spreading over many IPs can spend on the model.
# 300 calls a minute is about 100 Auto-fills a minute (each makes 1-3 calls). Raise it if real users hit "busy".
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

# Optional server-side cache of form mappings (fewer model calls). Update store/PRIVACY.md first: it says the server keeps
# no record of requests. Then: npx wrangler kv namespace create MAP_CACHE, and paste the id below.
# [[kv_namespaces]]
# binding = "MAP_CACHE"
# id = "<id from the command above>"

# Custom domain (optional, domain must be on your Cloudflare account):
# routes = [{ pattern = "api.example.com", custom_domain = true }]

# The privacy policy at /privacy is store/PRIVACY.md, bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
