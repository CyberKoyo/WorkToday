<!-- Trimmed from live job-boards.greenhouse.io application forms (2026-10-08). -->
<h1>Software Engineer</h1>
<form id="application-form" class="application--form">
<div class="application--questions">
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="first_name-label" for="first_name" class="label label">First Name<span aria-hidden="true">*</span></label><input id="first_name" class="input input__single-line" aria-label="First Name" aria-required="true" type="text" maxlength="255" autocomplete="given-name" value=""></div></div></div>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="email-label" for="email" class="label label">Email<span aria-hidden="true">*</span></label><input id="email" class="input input__single-line" aria-label="Email" aria-required="true" type="text" maxlength="255" autocomplete="email" value=""></div></div></div>
<div><fieldset class="phone-input"><legend class="visually-hidden">Phone</legend><div class="phone-input__country"><div class="select"><div class="select__container"><label id="country-label" for="country" class="label select__label">Country<span aria-hidden="true">*</span></label><div class="select-shell"><div><div class="select__control"><div class="select__value-container"><div class="select__placeholder" id="react-select-country-placeholder"></div><div class="select__input-container" data-value=""><input class="select__input" id="country" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="country-label" aria-required="true" role="combobox" value=""></div></div><div class="select__indicators"><button type="button" class="icon-button icon-button--sm" aria-label="Toggle flyout" tabindex="-1"></button></div></div></div><input required="" tabindex="-1" aria-hidden="true" value=""></div></div></div></div><div class="phone-input__phone"><div class="text-input-wrapper"><div class="input-wrapper"><label id="phone-label" for="phone" class="label label">Phone<span aria-hidden="true">*</span></label><input id="phone" class="input input__single-line" aria-label="Phone" aria-required="true" type="tel" maxlength="255"></div></div></div></fieldset></div>
<div class="field-wrapper"><div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload"><div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div><div class="file-upload__wrapper"><div class="button-container"><div class="secondary-button"><div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="resume">Attach</label><input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div><div class="secondary-button"><div><button type="button" class="btn btn--pill" data-testid="resume-text">Enter manually</button><label class="visually-hidden" for="resume_text">Enter manually</label></div></div></div></div></div></div>
</div>
<div class="application--questions"><hr>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="question_1-label" for="question_1" class="label label">LinkedIn Profile</label><input id="question_1" class="input input__single-line" aria-label="LinkedIn Profile" aria-required="false" type="text" maxlength="255" value=""></div></div></div>
<div class="field-wrapper field-wrapper--multiline"><div class="text-input-wrapper"><div class="input-wrapper input-wrapper__multi-line"><label id="question_2-label" for="question_2" class="label label">Why do you want to join us?<span aria-hidden="true">*</span></label><textarea id="question_2" class="input input__multi-line" aria-label="Why do you want to join us?" aria-required="true" rows="4"></textarea></div></div></div>
<div class="field-wrapper"><div class="select"><div class="select__container"><label id="question_3-label" for="question_3" class="label select__label">Are you authorized to work in the country for which you applied? <span aria-hidden="true">*</span></label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__placeholder" id="react-select-question_3-placeholder">Select...</div><div class="select__input-container" data-value=""><input class="select__input" id="question_3" tabindex="0" type="text" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="question_3-label" aria-required="true" role="combobox" value=""></div></div></div><input required="" tabindex="-1" aria-hidden="true" value=""></div></div></div></div>
<div class="field-wrapper"><fieldset class="checkbox" id="question_4[]" aria-required="true"><legend class="label checkbox__description">Which countries could you work in?<!-- --> <span class="required">*</span></legend><div class="checkbox__wrapper"><div class="checkbox__input"><input required="" type="checkbox" id="question_4[]_1" name="question_4[]" value="1"></div><label for="question_4[]_1">Australia</label></div><div class="checkbox__wrapper"><div class="checkbox__input"><input required="" type="checkbox" id="question_4[]_2" name="question_4[]" value="2"></div><label for="question_4[]_2">Canada</label></div></fieldset></div>
</div>
<div class="education--container"><div class="education--form"><hr><div class="education--header"><p class="body body--medium">Education</p></div>
<div class="select"><div class="select__container select__container--outside-label"><label id="school--0-label" for="school--0" class="label select__label">School<span aria-hidden="true">*</span></label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__placeholder">Select...</div><div class="select__input-container" data-value=""><input class="select__input" id="school--0" tabindex="0" type="text" aria-labelledby="school--0-label" aria-required="true" role="combobox" value=""></div></div></div><input required="" tabindex="-1" aria-hidden="true" value=""></div></div></div>
<div class="select"><div class="select__container select__container--outside-label"><label id="degree--0-label" for="degree--0" class="label select__label">Degree<span aria-hidden="true">*</span></label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__placeholder">Select...</div><div class="select__input-container" data-value=""><input class="select__input" id="degree--0" tabindex="0" type="text" aria-labelledby="degree--0-label" aria-required="true" role="combobox" value=""></div></div></div><input required="" tabindex="-1" aria-hidden="true" value=""></div></div></div>
</div><button class="add-another-button" type="button">Add another</button></div>
<div class="eeoc__container body"><div class="divider" role="separator"></div><div><h2 class="section-header font-primary">Voluntary Self-Identification</h2></div>
<div class="eeoc__question__wrapper"><div class="select"><div class="select__container"><label id="gender-label" for="gender" class="label select__label">Gender</label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__placeholder">Select...</div><div class="select__input-container" data-value=""><input class="select__input" id="gender" tabindex="0" type="text" aria-labelledby="gender-label" aria-required="false" role="combobox" value=""></div></div></div></div></div></div></div>
</div>
<div class="application--submit"><button type="submit" class="btn btn--pill">Submit application</button></div>
</form>
