<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Job Application Filler — Applications</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 16px; }
    label { display: grid; gap: 2px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Applications</h1>
  <form id="add">
    <label>Title <input id="title" required /></label>
    <label>Company <input id="company" required /></label>
    <label>Date <input id="date" type="date" required /></label>
    <label>Salary <input id="salary" /></label>
    <label>Location <input id="location" /></label>
    <button id="submit" type="submit">Add</button>
    <button id="cancel" type="button" hidden>Cancel</button>
  </form>
  <p><label>Import .csv or .ods (first row = column names) <input id="import" type="file" accept=".csv,.ods,.fods" /></label></p>
  <p id="status" role="status"></p>
  <table>
    <thead><tr><th>Title</th><th>Company</th><th>Date</th><th>Salary</th><th>Location</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="empty">No applications logged yet.</p>
  <script type="module" src="./main.ts"></script>
</body>
</html>
