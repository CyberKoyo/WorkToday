# Push a tag matching extension/package.json's version (v1.0.1) to test, deploy the mapping server and submit both stores.
# Run it by hand from the Actions tab with "dry run" ticked to check the store credentials without uploading.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check store credentials only; upload nothing, skip the server deploy
        type: boolean
        default: true

# Read-only token: npm ci runs dependency install scripts, which must not be able to push or tag.
permissions:
  contents: read

jobs:
  # No secrets here: this is the job that runs the dependencies' install scripts, tests and builds.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci

      # Both stores refuse a version they have seen, so a tag that disagrees with the manifest stops here.
      - name: Tag matches extension version
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./extension/package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm test
      - run: npx tsc --noEmit -p extension
      - run: npm run zip -w extension && npm run zip:firefox -w extension
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # .output is a dot folder, which upload-artifact skips unless told otherwise; the glob still takes only the zips.
        with: { name: zips, path: extension/.output/*.zip, include-hidden-files: true, if-no-files-found: error, retention-days: 7 }

  # The secrets live in the "release" environment, which waits for the owner's approval.
  # Installed without install scripts: wrangler and publish-extension are plain JavaScript and need none.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: zips, path: extension/.output }

      # Before the stores: reviewers read the live /privacy, which is served from store/PRIVACY.md.
      - name: Deploy mapping server
        if: ${{ !inputs.dry_run }}
        run: npm run deploy -w server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # What `wxt submit` runs, called directly: wxt itself is not set up without its install script.
      - name: Submit to Chrome Web Store and AMO
        working-directory: extension
        run: |
          v=$(node -p "require('./package.json').version")
          npx publish-extension \
            --chrome-zip .output/extension-$v-chrome.zip \
            --firefox-zip .output/extension-$v-firefox.zip \
            --firefox-sources-zip .output/extension-$v-sources.zip
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: job-application-filler@worktoday
          FIREFOX_COMPATIBILITY: firefox,android
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
