name: CI
on:
  pull_request:
  push:
    branches: [main]

# Read-only token: npm ci runs dependency install scripts, which must not be able to push or tag.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p extension
      - run: npm run build -w extension && npm run build:firefox -w extension
